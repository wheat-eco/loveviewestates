<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f9f9f9;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; margin-top: 20px; background-color: #ffffff;">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #323232;">
                <img src="https://{{{EMAIL_DOMAIN}}}/logo-1.png" alt="Love View Estate Logo" width="200" style="display: block;" />
            </td>
        </tr>
        <tr>
            <td style="padding: 40px 30px;">
                <h1 style="color: #323232; font-size: 24px; margin: 0;">New Contact Form Submission</h1>
                <p style="color: #4a4a4a; font-size: 16px; line-height: 1.6; margin: 20px 0;">You have received a new message from the contact form on your website.</p>
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
                    <tr><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;"><strong>Name:</strong></td><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;">{{{name}}}</td></tr>
                    <tr><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;"><strong>Email:</strong></td><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;"><a href="mailto:{{{email}}}" style="color: #e4b611;">{{{email}}}</a></td></tr>
                    <tr><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;"><strong>Phone:</strong></td><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;">{{{phone}}}</td></tr>
                    <tr><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;"><strong>Subject:</strong></td><td style="padding: 10px; border-bottom: 1px solid #eeeeee; color: #4a4a4a; font-size: 16px;">{{{subject}}}</td></tr>
                </table>
                <p style="color: #323232; font-size: 18px; margin: 20px 0 10px 0;"><strong>Message:</strong></p>
                <p style="color: #4a4a4a; font-size: 16px; line-height: 1.6; margin: 0; padding: 15px; background-color: #f9f9f9; border-radius: 4px;">{{{message}}}</p>
            </td>
        </tr>
        <tr>
            <td style="padding: 30px; background-color: #f0f0f0; text-align: center;">
                <p style="margin: 0; color: #666; font-size: 12px;">This is an automated notification from your website.</p>
            </td>
        </tr>
    </table>
</body>
</html>
